framework:
    messenger:
        failure_transport: failed

        transports:
            # Doctrine transport: no extra infrastructure, the queue lives in MariaDB
            # (tables created by the migrations, hence auto_setup=0 in MESSENGER_TRANSPORT_DSN).
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 0 # a failed sync is recorded in sync_run; the next run will retry
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'
            sync: 'sync://'

        routing:
            # "Synchroniser maintenant" and the schedule both go through the worker,
            # so the web request returns immediately.
            App\Message\SyncCommvault: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
